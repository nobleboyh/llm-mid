# GateMid — Team Smart Router + Headroom Compression
# LiteLLM Proxy Configuration
# Generated by quick-setup.sh

model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
    model_info:
      disable_background_health_check: true

  - model_name: gemini-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
      order: 2
    model_info:
      disable_background_health_check: true

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: "os.environ/GEMINI_API_KEY"
    model_info:
      disable_background_health_check: true

  - model_name: gemini-pro
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
      order: 2
    model_info:
      disable_background_health_check: true

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
    model_info:
      disable_background_health_check: true

  - model_name: deepseek-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: "os.environ/DEEPSEEK_API_KEY"
    model_info:
      disable_background_health_check: true

  - model_name: deepseek-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: "os.environ/GEMINI_API_KEY"
      order: 2
    model_info:
      disable_background_health_check: true

  # Ragas Eval Model (LLM-as-judge — routes through LiteLLM)
  # The eval worker calls this with model="ragas-eval". The RagasLogger
  # callback skips logging for this model prefix, preventing an eval loop.
  - model_name: ragas-eval
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"
      order: 1
    model_info:
      disable_background_health_check: true

  # Fallback: Gemini Flash (if DeepSeek is slow or down)
  - model_name: ragas-eval
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
      order: 2
    model_info:
      disable_background_health_check: true

  # Team Smart Router — auto-classifies and routes
  - model_name: team-smart-router
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: gemini-flash
          MEDIUM: gemini-flash
          COMPLEX: deepseek-pro
          REASONING: deepseek-pro
        token_thresholds:
          simple: 100
          complex: 2000
        dimension_weights:
          tokenCount: 0.05
          codePresence: 0.10
          reasoningMarkers: 0.30
          technicalTerms: 0.10
          simpleIndicators: 0.15
          multiStepPatterns: 0.05
          questionComplexity: 0.05
        tier_boundaries:
          simple_medium: 0.15
          medium_complex: 0.3
          complex_reasoning: 0.55
      complexity_router_default_model: gemini-flash
    model_info:
      disable_background_health_check: true

litellm_settings:
  drop_params: true
  callbacks: ['proxy.callback.ragas_callback', 'proxy.callbacks.local_provider_failure.local_provider_failure_logger']
  num_retries: 1                    # try each deployment once before falling back
  request_timeout: 60               # fail per-attempt if no response in 30s
  allowed_fails: 3                  # cooldown model after 3 failures in a minute
  cooldown_time: 60                 # skip cooldowned model for 60 seconds

router_settings:
  # Cross-model fallbacks — reached only if ALL deployments
  # under the primary model_name fail.
  fallbacks:
    - "gemini-flash": ["deepseek-flash"]
    - "gemini-pro": ["deepseek-flash"]
    - "deepseek-pro": ["gemini-pro"]
  routing_strategy: simple-shuffle

general_settings:
  master_key: "os.environ/GATEWAY_MASTER_KEY"
  # Serve /health from cached results instead of live-probing every
  # deployment (init-007). The background loop still runs but probes nothing
  # (see model_info.disable_background_health_check below).
  background_health_checks: true
